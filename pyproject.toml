[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "computation-atlas"
version = "0.1.0"
description = "Offline data pipeline for Computation Atlas: a navigable map of cellular-automaton rule space"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/computation_atlas"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["source"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "differential: compares the Rust engine against the Python reference; needs the ca-diff binary",
  "sweep: runs the metric sweep; needs the ca-sweep binary",
]
