[workspace]
members = [
    "crates/ca-core",
    "crates/ca-wasm",
    "crates/ca-diff",
    "crates/ca-sweep",
    "crates/ca-cryptid",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/JoeyHammoth/chaotic-automata"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
