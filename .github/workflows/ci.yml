name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -m "not differential and not sweep"

  engine:
    name: Engine (Rust) tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test the workspace
        run: cargo test --workspace
      - name: Build the wasm module
        run: cargo build -p ca-wasm --target wasm32-unknown-unknown --release
      - name: Check the module size stays inside the budget
        run: |
          bytes=$(stat -c%s target/wasm32-unknown-unknown/release/ca_wasm.wasm)
          echo "wasm module: ${bytes} bytes"
          test "${bytes}" -lt 300000

  differential:
    name: Differential harness (engine vs Python reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build the engine CLIs
        run: cargo build -p ca-diff -p ca-cryptid --release
      - name: Compare engine against reference, bit-exact
        run: pytest -m differential -v
        env:
          CA_DIFF_BIN: target/release/ca-diff
          CA_CRYPTID_BIN: target/release/ca-cryptid
          CA_DIFF_LATTICE: "64"
          CA_DIFF_STEPS: "10"

  sweep:
    name: Sweep golden and sample product
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the pipeline
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build the sweep
        run: cargo build -p ca-sweep --release
      - name: Golden drift and landmark classes
        run: pytest -m sweep -v
        env:
          CA_SWEEP_BIN: target/release/ca-sweep

  site:
    name: Site typecheck, tests and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install
        run: npm ci
        working-directory: site
      - name: Build the engine module
        run: npm run build:wasm
        working-directory: site
        env:
          CI: "true"
      - name: Typecheck
        run: npm run typecheck
        working-directory: site
      - name: Unit tests
        run: npm test
        working-directory: site
      - name: Build the site
        run: npm run build
        working-directory: site
      - name: Install a browser for the smoke test
        run: npx playwright install --with-deps chromium
        working-directory: site
      - name: Smoke test the running page
        run: npm run e2e
        working-directory: site

  a11y:
    name: Accessibility budget (Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install
        run: npm ci
        working-directory: site
      - name: Build the engine module
        run: npm run build:wasm
        working-directory: site
        env:
          CI: "true"
      - name: Build the site
        run: npm run build
        working-directory: site
      - name: Score the built page against the 95 accessibility budget
        working-directory: site
        run: |
          set -euo pipefail
          # Lighthouse is a pinned devDependency installed by `npm ci` above, so this job reads one
          # version from one place. It used to be `npx --yes lighthouse@<version>`, which resolves the
          # tool's whole dependency tree on every run; that is what failed four times in one day --
          # once on a withdrawn transitive package, three times in Chrome's launcher -- always before
          # a score existed (#53). `--no-install` makes a missing binary a loud failure instead.
          npx --no-install lighthouse --version
          npm run preview -- --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:4173/ > /dev/null; then
            cat "$RUNNER_TEMP/preview.log"
            echo "the preview server never answered on port 4173"
            exit 1
          fi
          for page in index.html inspector.html stress.html verifier.html hashlife.html; do
            npx --no-install lighthouse "http://127.0.0.1:4173/${page}" \
              --only-categories=accessibility \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output-path="$RUNNER_TEMP/a11y-${page%.html}.json" \
              --quiet
            node scripts/check-a11y.mjs "$RUNNER_TEMP/a11y-${page%.html}.json"
          done
