name: Pages

# The deliverable is a static site, so this workflow is the only path a visitor ever takes. It builds
# exactly what CI validates (same wasm build, same npm script) and publishes it under the project
# sub-path, so the measured page and the tested page are the same artefact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site for Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install
        run: npm ci
        working-directory: site
      - name: Build the engine module
        run: npm run build:wasm
        working-directory: site
        env:
          CI: "true"
      - name: Build the site under the project sub-path
        run: npm run build
        working-directory: site
        env:
          VITE_BASE: /chaotic-automata/
      - name: Check the bundle stays inside the first-load budget
        run: |
          bytes=$(du -sb site/dist | cut -f1)
          echo "site/dist: ${bytes} bytes uncompressed"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
